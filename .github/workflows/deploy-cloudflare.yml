name: Publish to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deployment configuration
        id: deployment-config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_D1_DATABASE_ID" && -n "$ADMIN_EMAIL" && -n "$ADMIN_PASSWORD_HASH" && -n "$SESSION_SECRET" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare 자동 배포가 GitHub Secrets 등록을 기다리고 있습니다."
          fi

      - name: Check out source
        if: steps.deployment-config.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Use Node.js 22
        if: steps.deployment-config.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.deployment-config.outputs.ready == 'true'
        run: npm ci

      - name: Build and test
        if: steps.deployment-config.outputs.ready == 'true'
        run: npm test

      - name: Prepare Cloudflare configuration
        if: steps.deployment-config.outputs.ready == 'true'
        run: node scripts/prepare-cloudflare-deploy.mjs
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}

      - name: Apply database migrations and publish
        if: steps.deployment-config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.92.0"
          command: deploy --config dist/server/wrangler.json
          preCommands: wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
          secrets: |
            ADMIN_EMAIL
            ADMIN_PASSWORD_HASH
            SESSION_SECRET
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
